<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="voxLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#06b6d4" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#voxLogoGrad)" filter="url(#logoShadow)" />
  <rect x="4" y="4" width="56" height="56" rx="16" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Acoustic Voice Waveform Equalizer Bars -->
  <g fill="#ffffff">
    <rect x="14" y="25" width="5" height="14" rx="2.5" />
    <rect x="23" y="16" width="5" height="32" rx="2.5" />
    <rect x="32" y="10" width="5" height="44" rx="2.5" />
    <rect x="41" y="20" width="5" height="24" rx="2.5" />
    <rect x="50" y="27" width="5" height="10" rx="2.5" />
  </g>
</svg>
